<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="すべての学生のMIRAIにつながるプロジェクト、MIRAIS。自分の目指す仕事、やりたいこと、好きなことをあきらめなくていい社会へ。">
<title>MIRAIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+KR:wght@700&display=swap">
<style>
/* Layout: ピル型の固定メニュー → 色面ヒーロー（記事スライダー＋巨大ロゴ）→ 流れるコピー → 罫線グリッドの記事 → ニュース行リスト → 流れるフッター
   Single bold light theme by choice: every color is set explicitly. */
:root{
  --ground:#F4F3EE; --gray:#DCDAD3; --ink:#111111; --muted:#55524B;
  --hero:#3B5BFF; --pill:#E4FF3A; --tag:#E8452C; --white:#FFFFFF;
  --ph1:#FF9F6B; --ph2:#9CC9FF; --ph3:#F6D44A;
  --f-logo:"Archivo Black","Arial Black",sans-serif;
  --f-latin:"Jost","Futura","Avenir Next",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-jp);font-size:16px;line-height:1.8;margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.gut{padding-inline:16px}

/* pill nav */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;gap:10px;padding-block:14px;padding-inline:16px;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--pill);color:var(--ink);border-radius:999px;padding:6px 8px;max-width:100%;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 0 var(--ink)}
.pill::-webkit-scrollbar{display:none}
.pill a{white-space:nowrap;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px}
.pill a:hover{background:var(--ink);color:var(--pill)}
.pill .home{font-family:var(--f-logo);font-weight:400;letter-spacing:.02em}
.cta{pointer-events:auto;display:flex;align-items:center;white-space:nowrap;background:var(--ink);color:var(--pill);border-radius:999px;padding:8px 20px;font-weight:700;font-size:15px}
@media (max-width:640px){.cta{display:none}}

/* hero */
.hero{background:var(--hero);margin-top:-80px;padding-top:96px;position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;color:var(--white);padding-inline:16px;padding-block:8px 18px}
.hero-top p{margin:0;font-weight:700;font-size:clamp(15px,2.2vw,20px);line-height:1.5}
.hero-top small{font-family:var(--f-latin);font-size:13px;letter-spacing:.08em;opacity:.85}
.slider{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:16px;padding-bottom:clamp(60px,12vw,150px);scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(82%,900px);scroll-snap-align:center;position:relative;aspect-ratio:16/9;max-width:100%;background:var(--white)}
.slide .media{position:absolute;inset:0}
.slide .cap{position:absolute;left:0;bottom:12%;background:var(--white);padding:14px 18px 16px;max-width:min(560px,78%)}
.slide .cap h2{margin:0 0 6px;font-size:clamp(17px,2.6vw,28px);line-height:1.45;font-weight:900;text-wrap:balance}
.slide .cap span{font-size:13px;color:var(--muted)}
.biglogo{position:absolute;left:0;right:0;bottom:-0.12em;text-align:center;font-family:var(--f-logo);font-size:clamp(84px,21vw,300px);line-height:1;color:var(--ink);pointer-events:none;letter-spacing:-.02em;white-space:nowrap}
.arrows{position:absolute;right:16px;bottom:16px;display:flex;gap:10px;z-index:2}
.arr{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:var(--pill);color:var(--ink);font-size:18px;cursor:pointer}

/* marquee */
.marq{overflow:hidden;white-space:nowrap;border-block:1px solid var(--ink)}
.marq .track{display:inline-flex;animation:mq 40s linear infinite}
.marq span{padding-inline:28px;display:inline-flex;align-items:center;gap:28px}
.marq.copy span{font-size:clamp(15px,2vw,20px);padding-block:14px;font-weight:500}
.marq.copy span::after{content:"⟶";font-family:var(--f-latin)}
.marq.giant{border:0;background:var(--gray)}
.marq.giant span{font-family:var(--f-logo);font-size:clamp(48px,9vw,110px);line-height:1.25;padding-block:20px 10px;letter-spacing:.01em}
.marq.giant .track{animation-duration:30s}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq .track{animation:none}}

/* section heads */
.sec-h{display:flex;justify-content:center;align-items:center;padding-block:18px;border-bottom:1px solid var(--ink);font-family:var(--f-latin);font-size:22px;letter-spacing:.03em}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-block:20px;padding-inline:16px;background:var(--gray);border-bottom:1px dashed var(--ink)}
.chip{font:500 13px var(--f-jp);border:1px solid var(--ink);background:var(--white);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--pill)}

/* grid with dashed rules */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--gray)}
.cell{padding:32px 28px 36px;border-right:1px dashed var(--ink);border-bottom:1px dashed var(--ink);display:flex;flex-direction:column;gap:14px;min-width:0}
.cell:nth-child(3n){border-right:0}
.cell .thumb{position:relative;aspect-ratio:4/3;max-width:100%}
.cell .thumb .media{position:absolute;inset:0}
.label{position:absolute;top:12px;left:12px;background:var(--white);border:1px solid var(--ink);font-size:13px;padding:3px 10px;z-index:1;font-weight:500}
.cell h3{margin:0;font-size:clamp(17px,1.8vw,21px);line-height:1.6;font-weight:700;text-wrap:balance}
.cell:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.cell .who{font-size:14px;font-weight:700;margin:0}
.cell .sub{font-size:12.5px;color:var(--muted);margin:-8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--white)}
.num{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:10px;font-family:var(--f-latin);font-size:22px}
.num small{font-family:var(--f-jp);font-size:13px;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cell:nth-child(3n){border-right:1px dashed var(--ink)}.cell:nth-child(2n){border-right:0}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}.cell{border-right:0!important;padding:24px 16px 28px}}

/* news rows */
.rows{border-bottom:1px solid var(--ink)}
.row{display:grid;grid-template-columns:120px 110px minmax(0,1fr) 180px 70px;align-items:center;gap:0;border-bottom:1px solid var(--ink);padding-inline:16px}
.row:last-child{border-bottom:0}
.row>*{padding-block:20px}
.row .d{font-family:var(--f-latin);font-size:16px;font-variant-numeric:tabular-nums;border-right:1px solid var(--ink);padding-block:4px}
.row .t{justify-self:start;margin-left:20px;background:var(--tag);color:var(--white);font-family:var(--f-latin);font-size:14px;padding:3px 12px;letter-spacing:.04em;white-space:nowrap}
.row .ti{padding-inline:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{border-left:1px solid var(--ink);padding:4px 20px;font-size:14px}
.row .w{font-family:var(--f-latin);font-size:15px;text-align:right}
.row:hover .ti{text-decoration:underline}
@media (max-width:760px){
  .row{grid-template-columns:auto auto minmax(0,1fr);row-gap:0;padding-block:14px}
  .row>*{padding-block:2px}
  .row .ti{grid-column:1/-1;padding-inline:0;white-space:normal;margin-top:6px}
  .row .c,.row .w{display:none}
  .row .d{padding-right:14px}.row .t{margin-left:14px}
}
.archive{display:flex;justify-content:center;padding-block:44px 64px}
.archive a{position:relative;border:1px solid var(--ink);border-top:0;padding:16px 80px 18px;font-family:var(--f-latin);font-size:16px;background:var(--ground)}
.archive a::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink)}

/* placeholder media */
.media{background:var(--ph2);overflow:hidden}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.media .ph{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:flex-end;padding:14px;font-family:var(--f-logo);font-size:clamp(20px,2.8vw,34px);line-height:1.05;color:var(--ink);text-align:right;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.media.missing img{display:none}
.media.missing .ph{display:flex}
.media{position:relative}
.c-esports .media{background:var(--ph2)}
.c-parasports .media{background:var(--ph1)}
.c-jyunin .media{background:var(--ph3)}

/* article */
.a-head{background:var(--hero);color:var(--white);margin-top:-80px;padding-top:108px;padding-bottom:40px}
.a-head .in{max-width:760px;margin-inline:auto}
.a-head .back{display:inline-block;font-size:14px;margin-bottom:18px;border-bottom:1px solid currentColor}
.a-head .series{display:inline-block;background:var(--pill);color:var(--ink);font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
.a-head h1{font-size:clamp(26px,4.6vw,44px);line-height:1.4;margin:14px 0 12px;font-weight:900;text-wrap:balance}
.a-head .by{font-family:var(--f-latin);font-size:15px;letter-spacing:.04em}
.a-body{max-width:760px;margin-inline:auto;padding-block:0 64px}
.a-body .cover{aspect-ratio:16/9;max-width:100%;margin-top:-1px;border:1px solid var(--ink);position:relative}
.a-body .cover .media{position:absolute;inset:0}
.prose{max-width:680px;margin:40px auto 0}
.prose p{margin:0 0 1.5em}
.prose h2{font-size:22px;line-height:1.5;margin:2.4em 0 .9em;padding-bottom:8px;border-bottom:1px dashed var(--ink);font-weight:900}
.prose ol{padding:0;margin:0 0 1.5em;list-style:none;counter-reset:n;border-top:1px solid var(--ink)}
.prose ol li{counter-increment:n;display:flex;gap:16px;border-bottom:1px solid var(--ink);padding-block:10px}
.prose ol li::before{content:counter(n,decimal-leading-zero);font-family:var(--f-latin);min-width:2em}
.prose figure{margin:0 0 1.6em;aspect-ratio:4/3;position:relative;border:1px solid var(--ink)}
.prose figure .media{position:absolute;inset:0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 1.6em}
.gal figure{margin:0}
.ext{display:inline-flex;gap:10px;align-items:center;background:var(--ink);color:var(--pill);padding:10px 22px;border-radius:999px;font-weight:700;font-size:15px}
.src{margin-top:48px;padding-top:14px;border-top:1px dashed var(--ink);font-size:12px;color:var(--muted);overflow-wrap:anywhere}

footer .bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:28px 40px;padding-inline:16px;font-size:13px}
footer .logo{font-family:var(--f-logo);font-size:34px;line-height:1}
.note{background:var(--ink);color:var(--pill);font-size:12px;text-align:center;padding:6px 16px}
.err{padding:120px 16px;text-align:center;color:var(--muted)}
/* --- step1 additions: cards with separate tag links, pending items, list headers, features, related --- */
.cell{position:relative}
.cell .stretch::after{content:"";position:absolute;inset:0;z-index:0}
.cell .tags a,.cell .old{position:relative;z-index:1}
.tags a{font-size:12px;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--white)}
.tags a:hover{background:var(--ink);color:var(--pill)}
.cell.pending{background:var(--ground)}
.cell.pending .media{filter:saturate(.35)}
.stamp{position:absolute;right:12px;top:12px;z-index:1;background:var(--ink);color:var(--white);font-size:12px;padding:2px 10px;letter-spacing:.06em}
.old{align-self:flex-start;font-size:13px;font-weight:700;border-bottom:1.5px solid var(--ink)}
.cell.pending h3{color:var(--muted)}

.band{margin-top:-80px;padding-top:110px;padding-bottom:44px;padding-inline:16px;border-bottom:1px solid var(--ink)}
.band .in{max-width:1080px;margin-inline:auto}
.band .eyebrow{font-family:var(--f-latin);font-size:14px;letter-spacing:.12em}
.band h1{font-family:var(--f-logo);font-weight:400;font-size:clamp(40px,9vw,112px);line-height:1.05;margin:10px 0 18px;overflow-wrap:anywhere}
.band h1.jp{font-family:var(--f-jp);font-weight:900;font-size:clamp(32px,6.4vw,76px);line-height:1.25}
.band .catch{font-size:clamp(17px,2.2vw,22px);font-weight:700;margin:0 0 10px;max-width:36em;text-wrap:balance}
.band .intro{margin:0;max-width:40em;font-size:15px}
.band .count{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.band .count span{border:1px solid currentColor;border-radius:999px;padding:3px 14px;font-size:13px;font-weight:700}
.band .back{display:inline-block;font-size:14px;margin-bottom:14px;border-bottom:1px solid currentColor}

.empty{padding:56px 16px;text-align:center;background:var(--gray);border-bottom:1px solid var(--ink)}
.empty p{margin:0 auto;max-width:30em}

.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:1px solid var(--ink)}
.feat{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:230px;padding:22px 20px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-width:0}
.feat .nm{font-family:var(--f-logo);font-size:clamp(26px,3vw,34px);line-height:1.1;overflow-wrap:anywhere}
.feat .nm.jp{font-family:var(--f-jp);font-weight:900}
.feat p{margin:0;font-size:14px;font-weight:500;line-height:1.6}
.feat .ft{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid currentColor;padding-top:8px;font-family:var(--f-latin);font-size:14px}
.feat:hover .nm{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}

.cloud{display:flex;flex-wrap:wrap;gap:10px;padding:28px 16px 40px;justify-content:center;border-bottom:1px solid var(--ink)}
.cloud a{border:1.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;background:var(--white)}
.cloud a small{font-family:var(--f-latin);font-weight:500;margin-left:6px;color:var(--muted)}
.cloud a:hover{background:var(--ink);color:var(--pill)}
.cloud a:hover small{color:var(--pill)}
.cloud.genres a{background:var(--pill)}

.a-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.a-meta a{border-bottom:0}
.a-meta .series{border:1px solid var(--ink)}
.a-meta .gen{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.related{border-top:1px solid var(--ink)}
.related .sec-h{background:var(--ground)}
/* 旧・特集カルーセル（現在は未使用） */
.series{background:linear-gradient(90deg,var(--pill) 0%,var(--pill) 35%,var(--ground) 100%);border-block:1px dashed var(--ink);padding-block:56px 0;overflow:hidden}
.series .ttl{text-align:center;padding-inline:16px}
.series h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(56px,11vw,130px);line-height:1;margin:0;letter-spacing:.01em}
.series .ttl p{margin:14px 0 0;font-weight:700;font-size:clamp(16px,2vw,22px);letter-spacing:.06em}
.s-track{display:flex;align-items:stretch;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:48px;padding-inline:16px}
.s-track::-webkit-scrollbar{display:none}
.s-item{flex:0 0 auto;display:flex;padding-inline:14px;border-right:1px dashed var(--ink);scroll-snap-align:start}
.s-item:last-child{border-right:0}
.s-cover{position:relative;height:clamp(300px,34vw,400px);aspect-ratio:5/7;max-width:calc(100vw - 60px);display:flex;flex-direction:column;justify-content:space-between;padding:18px;overflow:hidden}
.s-item.wide .s-cover{aspect-ratio:7/5}
.s-cover .k{font-family:var(--f-latin);font-size:12px;letter-spacing:.14em;display:flex;justify-content:space-between}
.s-cover .nm{font-family:var(--f-logo);font-size:clamp(34px,4.6vw,58px);line-height:1;overflow-wrap:anywhere}
.s-cover .nm.jp{font-family:var(--f-jp);font-weight:900;line-height:1.15}
.s-item.wide .s-cover .nm{font-size:clamp(44px,6.4vw,84px)}
.s-cover .cp{font-size:14px;font-weight:700;line-height:1.55;margin:10px 0 0;max-width:22em}
.s-cover .ghost{position:absolute;right:-.08em;bottom:-.22em;font-family:var(--f-logo);font-size:clamp(150px,20vw,260px);line-height:1;opacity:.14;pointer-events:none}
.s-cover:hover .nm{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.s-ctl{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px clamp(16px,6vw,110px) 36px}
.s-ctl button.r{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.s-ctl button.r:hover{background:var(--ink);color:var(--pill)}
.dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--ink);opacity:.22;cursor:pointer}
.dots button[aria-current="true"]{opacity:1}
.s-more{display:flex;justify-content:center;border-top:1px dashed var(--ink);padding-block:44px 52px}
.s-more a{display:inline-flex;align-items:center;gap:16px;font-weight:900;font-size:clamp(18px,2.2vw,24px)}
.s-more a i{font-style:normal;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;font-size:22px}
.s-more a:hover i{background:var(--hero)}
/* step3: article blocks */
.prose .q{margin:1.8em 0 .6em;font-weight:900;display:flex;gap:10px}
.prose .q::before{content:"Q";font-family:var(--f-logo);font-weight:400;background:var(--ink);color:var(--pill);width:1.7em;height:1.7em;display:grid;place-items:center;flex:0 0 auto;font-size:14px;margin-top:2px}
.prose figcaption,.gal-cap{font-size:13px;color:var(--muted);margin:-1em 0 1.6em;line-height:1.6}
.prose figure{margin-bottom:1.4em}
.prose ul{padding-left:1.3em;margin:0 0 1.5em}
.prose ul li{margin-bottom:.25em}
.tbl{overflow-x:auto;margin:0 0 1.6em;border:1px solid var(--ink)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;line-height:1.55}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px dashed var(--ink);vertical-align:top}
.tbl th{background:var(--ink);color:var(--pill);font-weight:700;border-bottom:0}
.tbl tr:last-child td{border-bottom:0}
.video{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin:0 0 1.6em;padding:20px;background:var(--ink);color:var(--white)}
.video b{font-family:var(--f-logo);font-weight:400;font-size:20px;letter-spacing:.02em}
.video span{font-size:13px;opacity:.85}
.video a{margin-top:6px;background:var(--pill);color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px}
.ext.int{background:var(--pill);color:var(--ink);border:1.5px solid var(--ink)}
.more-all{display:flex;justify-content:center;padding-block:36px;background:var(--gray);border-bottom:1px solid var(--ink)}
.more-all a{display:inline-flex;align-items:center;gap:14px;font-weight:900;font-size:clamp(17px,2vw,22px)}
.more-all a i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center}
.vbadge{position:absolute;right:12px;bottom:12px;z-index:1;background:var(--ink);color:var(--pill);font-size:12px;font-weight:700;padding:2px 10px}
.yt{position:relative;aspect-ratio:16/9;max-width:100%;margin:0 0 1.6em;border:1px solid var(--ink);background:var(--ink)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.insta{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding:48px clamp(16px,6vw,96px);background:#00C2A8;color:#111111;border-bottom:1px solid var(--ink)}
.insta .eyebrow{font-family:var(--f-latin);letter-spacing:.14em;font-size:14px}
.insta h2{font-family:var(--f-jp);font-weight:900;font-size:clamp(28px,4.2vw,50px);line-height:1.2;margin:8px 0 12px}
.insta p{margin:0;max-width:30em;font-weight:500}
.insta .acts{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.insta .handle{font-family:var(--f-logo);font-size:clamp(28px,4vw,48px);line-height:1}
.insta .follow{display:inline-flex;align-items:center;gap:10px;background:#111111;color:var(--pill);padding:12px 24px;border-radius:999px;font-weight:700;font-size:16px}
.insta .sub{font-weight:700;border-bottom:1.5px solid currentColor}
@media (max-width:700px){.insta{grid-template-columns:minmax(0,1fr)}}
.insta-wrap{background:#00C2A8;border-bottom:1px solid var(--ink)}
.insta-wrap .insta{border-bottom:0}
.ig-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:clamp(16px,6vw,96px);scrollbar-width:none;padding:0 clamp(16px,6vw,96px) 8px}
.ig-track::-webkit-scrollbar{display:none}
.ig{flex:0 0 clamp(200px,26vw,300px);aspect-ratio:1/1;max-width:80vw;scroll-snap-align:start;position:relative;overflow:hidden;background:#0a8f7c;border:1.5px solid #111}
.ig img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.ig:hover img{transform:scale(1.05)}
.ig .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;font-size:12px;line-height:1.5;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ig .vid{position:absolute;top:10px;right:10px;background:#111;color:var(--pill);font-size:11px;font-weight:700;padding:2px 8px}
.ig-ctl{display:flex;justify-content:flex-end;gap:10px;padding:14px clamp(16px,6vw,96px) 40px}
.ig-ctl button{width:48px;height:48px;border-radius:50%;border:1.5px solid #111;background:transparent;color:#111;font-size:18px;cursor:pointer}
.ig-ctl button:hover{background:#111;color:var(--pill)}
@media (prefers-reduced-motion:reduce){.ig img{transition:none}}
.ytch{padding:56px clamp(16px,6vw,96px);background:#111111;color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:32px;align-items:center;border-bottom:1px solid var(--ink)}
.ytch .eyebrow{font-family:var(--f-latin);letter-spacing:.14em;font-size:14px;color:var(--pill)}
.ytch h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(36px,5vw,64px);line-height:1;margin:10px 0 14px}
.ytch p{margin:0 0 20px;opacity:.85;max-width:26em}
.ytch .go{display:inline-flex;gap:10px;align-items:center;background:var(--pill);color:#111;padding:12px 22px;border-radius:999px;font-weight:700}
.ytch .player{position:relative;aspect-ratio:16/9;max-width:100%;border:1.5px solid var(--pill);background:#000}
.ytch .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:820px){.ytch{grid-template-columns:minmax(0,1fr)}}
.yt.short{aspect-ratio:9/16;width:min(100%,360px);margin-inline:auto}

@media (max-width:860px){.ab-hero,.ab-ideal{grid-template-columns:minmax(0,1fr)}.ab-cans{grid-template-columns:minmax(0,1fr)}.can{border-right:0;border-bottom:1px dashed var(--ink)}}
/* MIRAISサークル 特設ページ */

@media (max-width:820px){.cc-pillars{grid-template-columns:minmax(0,1fr)}.pillar{border-right:0;border-bottom:1px solid var(--ink)}.pillar:last-child{border-bottom:0}}

/* スマホ用ヘッダー：ロゴを残し、丸いハンバーガーボタンでメニューを開く */
.m-logo,.burger{display:none}
@media (max-width:700px){
  .navbar{justify-content:space-between;align-items:center}
  .navbar .pill,.navbar .cta{display:none}
  .m-logo{pointer-events:auto;display:flex;align-items:center;height:52px;padding:0 22px;border-radius:999px;background:var(--pill);color:var(--ink);font-family:var(--f-logo);font-size:20px;letter-spacing:.02em;box-shadow:0 2px 0 var(--ink)}
  .burger{pointer-events:auto;display:grid;place-content:center;gap:6px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--pill)}
  .burger span{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--pill);transition:transform .25s,opacity .2s}
  .burger[aria-expanded="true"]{background:var(--pill);box-shadow:0 2px 0 var(--ink)}
  .burger[aria-expanded="true"] span{background:var(--ink)}
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(8.5px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8.5px) rotate(-45deg)}
}
.m-menu{position:fixed;inset:0;z-index:19;background:var(--hero);color:var(--white);padding:calc(env(safe-area-inset-top,0px) + 96px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.m-links{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.35)}
.m-links a{font-size:22px;font-weight:900;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.35);display:flex;justify-content:space-between}
.m-links a::after{content:"→";font-family:var(--f-latin);font-weight:400}
.m-cta{align-self:flex-start;background:var(--pill);color:var(--ink);padding:14px 24px;border-radius:999px;font-weight:900;font-size:16px}
.m-sns{display:flex;gap:18px;font-family:var(--f-latin);font-size:16px}
.m-sns a{border-bottom:1px solid currentColor}
.m-menu[hidden]{display:none}
@media (min-width:701px){.m-menu{display:none!important}}
@media (prefers-reduced-motion:reduce){.burger span{transition:none}}
/* ヒーロー：スマホでは縦長のスライドにして、見出しが切れないようにする */
.slide .cap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){
  .slider{gap:14px;padding-bottom:110px}
  .slide{flex:0 0 86%;aspect-ratio:4/5}
  .slide .cap{left:0;right:0;bottom:0;max-width:none;padding:16px 18px 18px}

  .biglogo{font-size:22.5vw;bottom:-.08em}
  .arrows{display:none}
}
/* お問い合わせフォーム */

.kr-faq .item p{margin:0 0 0 36px}
.kr-faq .item .q{margin:0 0 6px;font-weight:900;display:flex;gap:10px}
.kr-faq .item .q::before{content:"Q";font-family:var(--f-logo);background:var(--ink);color:var(--pill);width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto;font-size:14px;margin-top:2px}
.contact.kr{background:var(--white)}
.cf .radios{display:flex;gap:24px;flex-wrap:wrap}
.cf .radios label{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;font-weight:500}
.cf .radios input{width:20px;height:20px;padding:0;flex:0 0 auto}
.cf fieldset{border:0;margin:0;padding:0;min-width:0}
.cf legend{font-weight:700;font-size:14px;padding:0;margin-bottom:6px}
@media (max-width:820px){.kr-hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.kr-hero h1{font-size:32px}}

/* ===== MIRAIS WHITE（2026-10-24 着せ替え）=====
   白を基調に、黒の文字と細い罫線で組む。特集ごとの色は、カードや見出しの上の細い帯だけに使う。 */
:root{--ground:#FFFFFF;--gray:#F4F4F2;--ink:#1A1A1A;--muted:#5E5E5E;--line:#E2E2DE;--pill:#FFFFFF;--tag:#1A1A1A;--hero:#1A1A1A;
  --f-logo:"Jost","Futura","Avenir Next",sans-serif;--wrap:clamp(16px,6vw,96px)}
html,body{background:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* ヘッダー */
.navbar{background:#FFFFFF;border-bottom:1px solid var(--line);justify-content:space-between;align-items:center;padding:10px var(--wrap);pointer-events:auto}
.pill{background:transparent;box-shadow:none;border-radius:0;padding:0;gap:2px;flex:1 1 auto}
.pill a{font-weight:500;font-size:14px;padding:8px 10px;border-radius:0}
.pill a:hover{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.pill .home{font-family:var(--f-latin);font-weight:600;font-size:20px;letter-spacing:.22em;margin-right:auto;padding-left:0}
.cta{background:var(--ink);color:#FFFFFF;border-radius:4px;padding:10px 18px;font-size:14px}
@media (max-width:700px){
  .navbar{padding:8px 16px}
  .m-logo{background:transparent;box-shadow:none;padding:0;height:48px;font-family:var(--f-latin);font-weight:600;font-size:20px;letter-spacing:.22em}
  .burger{background:transparent;box-shadow:none;border-radius:0;width:48px;height:48px}
  .burger span{background:var(--ink)}
  .burger[aria-expanded="true"]{background:transparent;box-shadow:none}
}
.m-menu{background:#FFFFFF;color:var(--ink)}
.m-links{border-top:1px solid var(--line)}
.m-links a{border-bottom:1px solid var(--line);font-weight:700;font-size:20px}
.m-cta{background:var(--ink);color:#FFFFFF;border-radius:4px}
/* トップ */
.hero{background:#FFFFFF;margin-top:0;padding-top:48px}
.hero-top{color:var(--ink);padding-inline:var(--wrap);padding-block:0 28px}
.hero-top p{font-size:clamp(26px,4.2vw,48px);font-weight:900;line-height:1.35}
.hero-top small{color:var(--muted);opacity:1}
.slider{padding-inline:var(--wrap);padding-bottom:72px}
.slide{background:var(--gray)}
.slide .cap{bottom:0;border-top:1px solid var(--line)}
.arrows{right:var(--wrap);bottom:14px}
.arr{background:#FFFFFF;border:1px solid var(--ink)}
.arr:hover{background:var(--ink);color:#FFFFFF}
.biglogo,.marq{display:none}
@media (max-width:700px){.slider{padding-bottom:40px}}
/* 見出し */
.sec-h{justify-content:flex-start;padding:56px var(--wrap) 20px;border-bottom:0;font-family:var(--f-jp);font-weight:900;font-size:clamp(22px,2.6vw,28px);letter-spacing:0;background:transparent}
.sec-h::before{content:"";width:10px;height:10px;background:var(--ink);margin-right:12px;flex:0 0 auto}
/* 絞り込み・記事グリッド */
.filters{background:#FFFFFF;border-bottom:0;justify-content:flex-start;padding:0 var(--wrap) 20px}
.chip{border-color:var(--line);border-radius:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.grid{background:#FFFFFF;gap:32px 24px;padding:0 var(--wrap) 24px}
.cell,.cell:nth-child(3n),.cell:nth-child(2n){border:0;padding:0}
.cell .thumb{border-radius:6px;overflow:hidden}
.label{border:0;background:#FFFFFF;font-weight:700;border-radius:3px}
.cell h3{font-size:clamp(16px,1.6vw,19px)}
.tags a,.tags span{border-color:var(--line);border-radius:3px}
.tags a:hover{background:var(--ink);color:#FFFFFF}
.num{border-top:1px solid var(--line);font-size:16px;color:var(--muted)}
.cell.pending{background:#FFFFFF}
.stamp{border-radius:3px}
@media (max-width:600px){.grid{padding:0 16px 16px}.cell{padding:0!important}}
.media{background:var(--gray)}
.media .ph{color:var(--muted);font-weight:600;letter-spacing:.06em}
.more-all{background:#FFFFFF;border-bottom:0;padding-block:28px 48px}
.more-all a{font-size:16px;font-weight:700;border:1px solid var(--ink);border-radius:4px;padding:12px 22px;gap:12px}
.more-all a i{width:auto;height:auto;background:transparent;color:var(--ink);font-size:16px}
.more-all a:hover{background:var(--ink);color:#FFFFFF}
.more-all a:hover i{color:#FFFFFF}
/* お知らせ */
.rows{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 var(--wrap)}
.row{border-bottom:1px solid var(--line);padding-inline:0}
.row .d{border-right:0;color:var(--muted)}
.row .t{background:#FFFFFF;color:var(--ink);border:1px solid var(--ink);border-radius:3px;font-size:12px;padding:2px 10px}
.row .c{border-left:0;color:var(--muted)}
@media (max-width:760px){.rows{margin:0 16px}}
/* 特集カード */
.fx{padding-bottom:16px}
.feats{border-top:0;gap:16px;padding:0 var(--wrap) 8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.feat{background:#FFFFFF;color:var(--ink);border:1px solid var(--line);border-top:6px solid var(--fc,var(--ink));border-radius:6px;min-height:200px}
.feat .nm{font-family:var(--f-jp);font-weight:900;font-size:clamp(22px,2.4vw,28px)}
.feat p{color:var(--muted)}
.feat .ft{border-top:1px solid var(--line);font-size:13px}
.feat:hover{border-color:var(--ink);border-top-color:var(--fc,var(--ink))}
.feat:hover .nm{text-decoration:none}
/* ページ見出し・記事 */
.band{margin-top:0;padding:56px var(--wrap) 40px;background:#FFFFFF;color:var(--ink);border-top:8px solid var(--fc,var(--ink));border-bottom:1px solid var(--line)}
.band h1{font-family:var(--f-jp);font-weight:900;font-size:clamp(32px,5.6vw,64px);line-height:1.25}
.band .eyebrow{color:var(--muted)}
.band .count span{border-color:var(--line)}
.a-head{margin-top:0;padding-top:48px;background:#FFFFFF;color:var(--ink);border-top:8px solid var(--fc,var(--ink));border-bottom:1px solid var(--line)}
.a-head .series{background:#FFFFFF;border:1px solid var(--ink);border-radius:3px}
.a-head .by{color:var(--muted)}
.a-body .cover{border:0;margin-top:24px;border-radius:6px;overflow:hidden}
.prose h2{border-bottom:1px solid var(--line)}
.prose ol{border-top:1px solid var(--line)}.prose ol li{border-bottom:1px solid var(--line)}
.prose figure{border:0;border-radius:6px;overflow:hidden}
.prose .q::before{color:#FFFFFF;font-family:var(--f-latin);font-weight:600}
.tbl{border-color:var(--line)}.tbl th{color:#FFFFFF}.tbl th,.tbl td{border-bottom-style:solid;border-bottom-color:var(--line)}
.ext{color:#FFFFFF;border-radius:4px}
.ext.int{background:#FFFFFF;color:var(--ink);border:1px solid var(--ink)}
.video b{font-family:var(--f-latin)}.video a{background:#FFFFFF;color:var(--ink);border-radius:4px}
.vbadge{color:#FFFFFF;border-radius:3px}
.src{border-top:1px solid var(--line)}
.related{border-top:1px solid var(--line)}.related .sec-h{background:transparent}
.empty{background:var(--gray);border-bottom:0;margin:0 var(--wrap);border-radius:6px}
.cloud{justify-content:flex-start;padding:0 var(--wrap) 40px;border-bottom:0}
.cloud a{border:1px solid var(--line);border-radius:4px;font-weight:500}
.cloud.genres a{background:var(--gray)}
.cloud a:hover{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.cloud a:hover small{color:#FFFFFF}
/* 動画・Instagram */
.ytch{background:var(--gray);color:var(--ink);border-bottom:0;margin-top:40px}
.ytch .eyebrow{color:var(--muted)}
.ytch h2{font-family:var(--f-jp);font-weight:900}
.ytch p{opacity:1;color:var(--muted)}
.ytch .go{background:var(--ink);color:#FFFFFF;border-radius:4px}
.ytch .player{border:0;border-radius:6px;overflow:hidden}
.insta-wrap{background:#FFFFFF;border-bottom:0;border-top:1px solid var(--line)}
.insta{background:#FFFFFF}
.insta .handle{font-family:var(--f-latin);font-weight:600}
.insta .follow{background:var(--ink);color:#FFFFFF;border-radius:4px}
.ig{border:0;border-radius:6px;background:var(--gray)}
.ig .vid{color:#FFFFFF}
.ig-ctl button{border-color:var(--ink)}.ig-ctl button:hover{color:#FFFFFF}
/* MIRAISとは */
.about{background:#FFFFFF;border-bottom:0}
.ab-hero,.ab-ideal{border-bottom:1px solid var(--line)}
.ab-hero .q{font-family:var(--f-latin);font-weight:600;letter-spacing:.06em}
.ab-hero .q span{color:var(--muted)}
.ab-ch{background:var(--gray);color:var(--ink);border-bottom:0}
.ab-ch b{font-family:var(--f-latin);font-weight:600}
.ab-ideal li{border-color:var(--line);border-radius:4px}
.can{border-right:1px solid var(--line)}
.can .pic{border:0;border-radius:6px}
@media (max-width:860px){.can{border-right:0;border-bottom:1px solid var(--line)}}
/* MIRAISサークル */
.cc-hero{margin-top:0;padding-top:64px;background:#FFFFFF;border-top:8px solid #FFB020;border-bottom:1px solid var(--line)}
.cc-hero h1{font-family:var(--f-latin);font-weight:600;letter-spacing:.04em}
.cc-qs span{background:var(--gray);color:var(--ink);border-radius:4px;font-weight:500}
.cc-intro{border-bottom:1px solid var(--line)}
.cc-pillars{border-bottom:1px solid var(--line)}.pillar{border-right:1px solid var(--line)}
.pillar .no{color:var(--ink);-webkit-text-stroke:0;font-family:var(--f-latin);font-weight:600}
.cc-join{background:var(--gray);color:var(--ink);border-bottom:0}
.cc-join a{background:var(--ink);color:#FFFFFF;border-radius:4px}
@media (max-width:820px){.pillar{border-bottom:1px solid var(--line)}}
/* フォーム */
.contact{border-bottom:0;border-top:1px solid var(--line)}
.contact.pg{margin-top:0;padding-top:64px;background:#FFFFFF}
.contact h2{font-size:clamp(28px,4vw,44px)}
.cf label em{background:var(--ink);border-radius:2px}
.cf input,.cf select,.cf textarea{background:#FFFFFF;border:1px solid #BDBDB8;border-radius:4px}
.cf input:focus,.cf select:focus,.cf textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.cf button{color:#FFFFFF;border-radius:4px;font-weight:700}
.cf-msg{border:1px solid var(--ink);border-radius:4px}
.cf-msg.ok{background:var(--gray)}
/* 就活・進学お悩み相談 */
.sd-hero{margin-top:0;padding-top:64px;background:#FFFFFF;color:var(--ink);border-top:8px solid #E8452C;border-bottom:1px solid var(--line)}
.sd-hero .eyebrow{color:var(--muted)}
.sd-hero .free{background:var(--ink);color:#FFFFFF;border-radius:4px}
.sd-intro,.sd-topics,.sd-flow{border-bottom:1px solid var(--line)}
.sd-topic{border-right:1px solid var(--line)}
.sd-topic .k{color:var(--muted)}
.sd-step{border-right:1px solid var(--line)}
.sd-step b{font-family:var(--f-latin);font-weight:600}
@media (max-width:820px){.sd-topic,.sd-step{border-bottom:1px solid var(--line)}}
/* 韓流Meet up！ */
.kr-hero{margin-top:0;padding-top:64px;background:#FFFFFF;color:var(--ink);border-top:8px solid #3B5BFF;border-bottom:1px solid var(--line)}
.kr-hero .eyebrow{color:var(--muted)}
.kr-hero .chips span{border-color:var(--line)}
.kr-hero .go{background:var(--ink);color:#FFFFFF;border:0;box-shadow:none;border-radius:4px}
.kr-hero .word{background:var(--gray);border:0;border-radius:6px}
.kr-for{background:#FFFFFF;border-bottom:0;gap:16px;padding:0 var(--wrap) 8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kr-for div{border:1px solid var(--line);border-radius:6px}
.kr-for div b{font-weight:600;color:var(--muted);font-size:18px}
.kr-cur{background:var(--gray);border-bottom:0;margin-top:48px}
.kr-cur h2{font-family:var(--f-jp);font-weight:900;font-size:clamp(22px,2.6vw,28px)}
.kr-cur .ttl{text-align:left;padding:48px var(--wrap) 0}
.kr-cur .ttl small{color:var(--muted)}
.kr-lessons{max-width:none;padding:24px var(--wrap) 40px}
.kr-lesson{border:0;border-radius:6px}
.kr-lesson .k{color:var(--muted)}
.kr-lesson p{border-top:1px solid var(--line)}
.kr-flow{border-top:1px solid var(--line);padding:32px var(--wrap) 48px}
.kr-flow .in{max-width:none}
.kr-flow h3{text-align:left}
.kr-steps{border-top:1px solid var(--line)}.kr-steps div{border-bottom:1px solid var(--line)}
.kr-out{max-width:none;padding:0 var(--wrap) 48px}
.kr-out dl,.kr-out dl div,.kr-out dl div:last-child{border-color:var(--line)}
.kr-out dl div{border-bottom-style:solid}
.kr-teacher{border:0;background:var(--gray);border-radius:6px}
.kr-faq{border-bottom:0}
.kr-faq .in{max-width:none;padding:0 var(--wrap) 48px}
.kr-faq .item{border-bottom:1px solid var(--line)}
.kr-faq .item .q::before{color:#FFFFFF;font-family:var(--f-latin);font-weight:600}
/* フッター */
footer{border-top:1px solid var(--line);margin-top:48px}
footer .bottom{padding-inline:var(--wrap)}
footer .logo{font-family:var(--f-latin);font-weight:600;font-size:22px;letter-spacing:.22em}
.note{color:#FFFFFF}

/* ===== カラフルなアクセント（白ベースに複数の色を少しずつ）===== */
:root{--c1:#F0533A;--c2:#1E8FE1;--c3:#FFC530;--c4:#16A383;--c5:#8A63F5;--c6:#F0549A;
  --t1:#C93A22;--t2:#1670C0;--t3:#8F6400;--t4:#0E7A62;--t5:#6B45D9;--t6:#C93072;
  --rainbow:linear-gradient(90deg,var(--c1) 0 16.66%,var(--c3) 0 33.33%,var(--c4) 0 50%,var(--c2) 0 66.66%,var(--c5) 0 83.33%,var(--c6) 0)}
/* ロゴの横とフッターに6色のライン */
.pill .home::after,.m-logo::after,footer .logo::after{content:"";display:inline-block;width:36px;height:6px;margin-left:10px;vertical-align:middle;background:var(--rainbow);border-radius:3px}
footer{border-top:0;position:relative}
footer::before{content:"";display:block;height:6px;background:var(--rainbow)}
/* トップの見出し：MIRAIを1文字ずつ色分け */
.mirai i{font-style:normal}
.mirai i:nth-child(1){color:var(--t1)}.mirai i:nth-child(2){color:var(--t2)}.mirai i:nth-child(3){color:var(--t4)}.mirai i:nth-child(4){color:var(--t5)}.mirai i:nth-child(5){color:var(--t6)}
/* 見出しの四角を4色に */
.sec-h::before{width:12px;height:12px;background:conic-gradient(var(--c1) 0 25%,var(--c3) 0 50%,var(--c4) 0 75%,var(--c2) 0);border-radius:2px}
/* 記事サムネイルの特集ラベルを特集の色に */
.label{background:var(--fc,#FFFFFF);color:var(--fi,var(--ink))}
/* 特集カード：特集の色をうっすら敷く */
.feat{background:color-mix(in srgb,var(--fc,#FFFFFF) 12%,#FFFFFF);border-top-width:8px}
.feat:hover{background:color-mix(in srgb,var(--fc,#FFFFFF) 22%,#FFFFFF)}
.feat .ft{border-top-color:color-mix(in srgb,var(--fc,#E2E2DE) 40%,#FFFFFF)}
/* お知らせの種類ごとに色 */
.row .t{border:0;color:#FFFFFF;background:var(--ink)}
.row .t[data-t="EVENT"]{background:var(--t1)}
.row .t[data-t="CLASS"]{background:var(--t2)}
.row .t[data-t="CIRCLE"]{background:var(--t3)}
/* 絞り込みボタン：選んだときに色 */
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--t2);border-color:var(--t2)}
/* ボタン：ホバーで色が変わる */
.cta:hover,.cf button:hover,.kr-hero .go:hover,.ytch .go:hover,.insta .follow:hover,.cc-join a:hover,.m-cta:hover{background:var(--t2)}
.more-all a:hover{background:var(--t2);border-color:var(--t2)}
/* 動画・Instagramの帯 */
.ytch{background:color-mix(in srgb,var(--c2) 10%,#FFFFFF)}
.insta-wrap,.insta{background:color-mix(in srgb,var(--c6) 9%,#FFFFFF)}
.ab-ch{background:color-mix(in srgb,var(--c3) 22%,#FFFFFF)}
/* 韓流Meet up！ */
.kr-for div:nth-child(1){border-top:4px solid var(--c1)}.kr-for div:nth-child(1) b{color:var(--t1)}
.kr-for div:nth-child(2){border-top:4px solid #E09A00}.kr-for div:nth-child(2) b{color:var(--t3)}
.kr-for div:nth-child(3){border-top:4px solid var(--c4)}.kr-for div:nth-child(3) b{color:var(--t4)}
.kr-for div:nth-child(4){border-top:4px solid var(--c2)}.kr-for div:nth-child(4) b{color:var(--t2)}
.kr-for div:nth-child(5){border-top:4px solid var(--c5)}.kr-for div:nth-child(5) b{color:var(--t5)}
.kr-cur{background:color-mix(in srgb,var(--c2) 9%,#FFFFFF)}
.kr-lesson:nth-child(6n+1) .k span:last-child{color:var(--t1)}.kr-lesson:nth-child(6n+2) .k span:last-child{color:var(--t3)}
.kr-lesson:nth-child(6n+3) .k span:last-child{color:var(--t4)}.kr-lesson:nth-child(6n+4) .k span:last-child{color:var(--t2)}
.kr-lesson:nth-child(6n+5) .k span:last-child{color:var(--t5)}.kr-lesson:nth-child(6n+6) .k span:last-child{color:var(--t6)}
.kr-lesson .k span:last-child{font-weight:600;font-size:15px}
.kr-hero .word{background:color-mix(in srgb,var(--c6) 10%,#FFFFFF)}
.kr-hero .word b{color:var(--t2)}
.kr-steps b{color:var(--t2)}
.kr-faq .item .q::before{background:var(--t2)}
/* 就活相談・サークル */
.sd-step b{color:var(--t1)}
.sd-flow{background:color-mix(in srgb,var(--c1) 8%,#FFFFFF)}
.pillar .no{color:var(--t3)}
.cc-join{background:color-mix(in srgb,#FFB020 18%,#FFFFFF)}
.prose .q::before{background:var(--t2)}
</style>

function wireSeries(){

    const t=sec.querySelector("[data-series]"), items=[...t.children], dots=[...sec.querySelectorAll(".dots button")];
    const go=i=>{i=Math.max(0,Math.min(items.length-1,i));t.scrollTo({left:items[i].offsetLeft-t.offsetLeft-16,behavior:"smooth"})};
    const cur=()=>{let best=0,bd=1e9;items.forEach((el,i)=>{const d=Math.abs(el.offsetLeft-t.offsetLeft-16-t.scrollLeft);if(d<bd){bd=d;best=i}});return best};
    const mark=()=>{const c=cur();dots.forEach((d,i)=>d.setAttribute("aria-current",i===c))};
    sec.querySelectorAll("button.r").forEach(b=>b.onclick=()=>go(cur()+Number(b.dataset.dir)));

function wireContact(){
  app.querySelectorAll("form.cf").forEach(f=>{
    const out=f.querySelector(".cf-msg"), btn=f.querySelector("button");
    const say=(t,ok)=>{out.hidden=false;out.textContent=t;out.className="cf-msg "+(ok?"ok":"ng")};
    f.addEventListener("submit",e=>{
      e.preventDefault();
      if(f.querySelector('[name="_honey"]').value) return;
      const bad=[...f.querySelectorAll("[required]")].find(el=>el.type==="checkbox"?!el.checked:!el.value.trim());
      if(bad){say(bad.type==="checkbox"?"送信内容への同意にチェックを入れてください。":"必須の項目が入力されていません。入力してから送信してください。",false);bad.focus();return}
      const em=f.querySelector('[name="email"]');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){say("メールアドレスの形式が正しくありません。もう一度確認してください。",false);em.focus();return}
      const data=Object.fromEntries([...new FormData(f)].filter(([k])=>k!=="_honey").map(([k,v])=>[k,String(v).trim()]));
      data._subject=(f.dataset.prefix||"【MIRAIS お問い合わせ】")+(data["件名"]||(data["相談したい内容"]?data["相談したい内容"]+"／":"")+data["お名前"]+" さん"); data._template="table"; data._captcha="false";
      const label=btn.dataset.label||(btn.dataset.label=btn.textContent);
      btn.disabled=true; btn.textContent="送信中…";
      fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(data)})
        .then(r=>r.json().then(j=>({ok:r.ok,j})))
        .then(({ok,j})=>{ if(ok&&String(j.success)!=="false"){f.reset();say(f.dataset.done||"送信しました。内容を確認のうえ、メールでご連絡します。",true)} else throw 0 })
        .catch(()=>say("送信できませんでした。時間をおいてもう一度お試しください。",false))
        .finally(()=>{btn.disabled=false;btn.textContent=btn.dataset.label});
    });
  });
}

  <header class="band"><div class="in">

function tagsIndex(){
  app.innerHTML=`
  <header class="band"><div class="in">
    <div class="eyebrow">GENRES &amp; TAGS</div>
    <h1 class="jp">ジャンルとタグ</h1>

  <div class="sec-h">タグ</div>${tagCloud()}`;

function block(b,f){
  switch(b.type){
    case "p": return `<p>${esc(b.text)}</p>`;
    case "h": return `<h2>${esc(b.text)}</h2>`;
    case "q": return `<p class="q">${esc(b.text)}</p>`;
    case "img": return `<figure>${media(b.src,b.alt,f)}</figure>${b.caption?`<p class="gal-cap">${esc(b.caption)}</p>`:""}`;
    case "gallery": return `<div class="gal">${b.items.map(i=>`<figure>${media(i.src,i.alt,f)}</figure>`).join("")}</div>${b.caption?`<p class="gal-cap">${esc(b.caption)}</p>`:""}`;
    case "list": return b.ordered===false?`<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:`<ol>${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`;
    case "table": return `<div class="tbl"><table><thead><tr>${b.head.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "video": {const y=(b.href.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
      if(y) return `<div class="yt${b.vertical?" short":""}"><iframe src="https://www.youtube-nocookie.com/embed/${y}" title="${esc(b.title||"動画")}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;}
      return `<div class="video"><b>▶ VIDEO</b><span>この記事の動画は、MIRAISのYouTubeチャンネルで公開しています。</span><a href="${esc(b.href)}" target="_blank" rel="noopener">YouTubeチャンネルで見る ↗</a></div>`;
    case "link": return b.href.startsWith("#")?`<p><a class="ext int" href="${esc(b.href)}">${esc(b.label)} →</a></p>`:`<p><a class="ext" href="${esc(b.href)}" target="_blank" rel="noopener">${esc(b.label)} ↗</a></p>`;
    default: return "";
  }
}
function article(a){
  const f=D.features[a.feature], g=D.genres[a.genre];
  const same=ofFeature(a.feature).filter(x=>x.slug!==a.slug).slice(0,3);
  const seen=new Set([a.slug,...same.map(x=>x.slug)]);
  const byTag=done().filter(x=>!seen.has(x.slug)&&(x.tags||[]).some(t=>(a.tags||[]).includes(t))).sort(byDate).slice(0,3);
  app.innerHTML=`
  <header class="a-head gut" style="--fc:${f.color}"><div class="in">
    <a class="back" href="#">← トップへ</a><br>
    <div class="a-meta">
      <a class="series" href="#feature-${a.feature}">${esc(f.name)}</a>
      <a class="gen" href="#genre-${a.genre}">${esc(g.label)}</a>
    </div>
    <h1>${esc(a.title)}</h1>
    <div class="by">${fmt(a.date)}${a.date&&a.writer?"　／　":""}${esc(a.writer)}</div>
  </div></header>
  <article class="a-body gut">
    ${a.cover?`<div class="cover">${media(a.cover.src,a.cover.alt,f)}</div>`:""}
    <div class="prose">
      <div class="tags" style="margin-bottom:28px">${tagLinks(a)}</div>
      ${a.body.map(b=>block(b,f)).join("")}
      <p class="src">移行元：${esc(a.oldUrl)}</p>
    </div>
  </article>
  <section class="related">
    ${same.length?`<div class="sec-h">同じ特集の記事｜${esc(f.name)}</div>${grid(same)}`:""}
    ${byTag.length?`<div class="sec-h">関連タグの記事</div>${grid(byTag)}`:""}
  </section>`;
}

function route(){
  if(!D) return;
  const h=decodeURIComponent(location.hash.slice(1));
  let m;
  if(!h) home();
  else if(h==="features") featuresIndex();
  else if(h==="articles") articlesPage();
  else if(h==="tags") tagsIndex();
  else if(h==="about") aboutPage();
  else if(h==="contact") contactPage();
  else if(h==="feature-soudan"||h==="soudan") soudanPage();
  else if(h==="feature-korean"||h==="korean") koreanPage();
  else if(h==="feature-miraiscircle"||h==="circle") circlePage();
  else if((m=h.match(/^feature-(.+)$/))&&D.features[m[1]]) featurePage(m[1]);
  else if((m=h.match(/^tag-(.+)$/))&&D.tags[m[1]]) listPage("tag",m[1]);
  else if((m=h.match(/^genre-(.+)$/))&&D.genres[m[1]]) listPage("genre",m[1]);
  else{const a=done().find(x=>x.slug===h); a?article(a):home();}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
fetch("data/articles.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;route()})
  .catch(()=>{app.innerHTML='<p class="err">記事データを読み込めませんでした。ページを再読み込みしてください。</p>'});
</script>
