name: 旧サイトの写真を取り込む

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/articles.json", "scripts/fetch_images.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 写真をダウンロード
        run: python scripts/fetch_images.py
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add images data/articles.json
          git diff --cached --quiet || git commit -m "旧サイトの写真を取り込み"
          git push
